# ============================================================================
# YaaImg Docker Compose
# Runs both backend (ASP.NET) and frontend (Next.js) containers
# ============================================================================

services:
  # ASP.NET Core Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yaaimg-api
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Supabase__Url=${SUPABASE_URL}
      - Supabase__JwtSecret=${SUPABASE_JWT_SECRET}
      - Supabase__SecretKey=${SUPABASE_SECRET_KEY}
      - ConnectionStrings__DefaultConnection=${SUPABASE_DB_URL}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: yaaimg-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:5000}
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
